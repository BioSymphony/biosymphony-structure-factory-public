    image_family: ai-design
    install_method: alphafold_or_colabfold_runtime
    upstream_repo: "https://github.com/google-deepmind/alphafold"
    primary_source_checked: "2026-08-28; the upstream license records Apache-2.0 for code, and the README records CC BY 4.0 for model parameters."
    license_class: apache_2_code_cc_by_4_parameters
    license_gate: none
    runpod_fit: strong_with_gpu_and_database_plan
    gpu_class: "L40S/A100/H100; database search and model size affect memory and storage"
    smoke_command: "adapter_required"
    runtime_artifacts: "alphafold_multimer_predictions/, confidence_sidecars/, prediction_manifest.json"
    citation_notes: "Record the AlphaFold or ColabFold source revision, parameter revision, database or MSA posture, target and candidate hashes, model preset, seeds, and recycles."
    status: planned
    notes: "AlphaFold-Multimer v3 is a published-method substitute predictor. Runtime records must distinguish the upstream AlphaFold and ColabFold execution routes."
  proteinmpnn:
    role: sequence_design
    image_family: ai-design
    install_method: source
    upstream_repo: "https://github.com/dauparas/ProteinMPNN"
