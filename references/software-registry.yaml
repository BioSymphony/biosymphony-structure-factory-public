# Structure Factory software registry.
# Each entry must be verified from primary sources before status moves to ready.
# Human-readable public posture: docs/tooling-and-licensing.md
# Redistribution/image policy: docs/public-repo-and-private-image-policy.md
#
# Cloud backends: RunPod, AWS Batch, Lambda Cloud, and Modal are reviewed
# execution paths; see docs/compute-backends.md and modules/provider-profiles/.
# The runpod_fit field scores per-tool suitability for the RunPod pod path;
# Lambda and Modal fit are covered narratively in docs/compute-backends.md.
#
# The status field records source, license, and version review. It does not
# report installation, service availability, or adapter readiness. Read
# references/binder-execution-adapters.json for bundled binder execution.

software:
  relion:
    role: cryoem_reconstruction
    image_family: cryo-core
    install_method: source_or_package_build
    license_class: open_source_gplv2
    license_gate: none
    runpod_fit: strong
    gpu_class: "RTX 4090/L40S smoke; A100/H100 production"
    smoke_command: "relion_refine --version || relion --version"
    runtime_artifacts: "versions.json, relion_toolcheck.json"
    citation_notes: "Record RELION version and cite RELION methods papers appropriate to version."
    status: planned
    notes: "Primary open-source SPA processing lane."
  cryosparc:
    role: cryoem_reconstruction_gui
    image_family: cryosparc
    install_method: runtime_license_install_or_prebuilt_private_image
    license_class: free_nonprofit_academic_proprietary
    license_gate: required_runtime_secret
    runpod_fit: strong_with_license
    gpu_class: "L40S/A100/H100"
    smoke_command: "cryosparcm status"
    runtime_artifacts: "cryosparc_project_manifest.json, job_exports/"
    citation_notes: "Record CryoSPARC version and job metadata."
    status: gated
    notes: "Use license injected at runtime; do not commit license IDs."
  warp_m:
    role: cryoem_cryoet_processing
    image_family: cryo-core
    install_method: source_or_release_build
    license_class: open_source_gplv3
    license_gate: none
    runpod_fit: strong
    gpu_class: "RTX 4090/L40S smoke; A100/H100 production"
    smoke_command: "WarpTools --help || warp --help"
    runtime_artifacts: "warp_toolcheck.json, preprocessing_manifests/"
    citation_notes: "Record Warp/M/WarpTools versions and cite corresponding methods."
    status: planned
    notes: "Linux/CUDA lane for Warp, M, WarpTools, Noise2Map."
  motioncor:
    role: motion_correction
    image_family: cryo-core
    install_method: runtime_or_manual_installer
    license_class: free_academic_nonprofit
    license_gate: verify_before_packaging
    runpod_fit: strong
    gpu_class: "RTX 4090/L40S/A100"
    smoke_command: "MotionCor3 --help || MotionCor2 --help"
    runtime_artifacts: "motioncorr_versions.json, corrected_micrograph_manifest.json"
    citation_notes: "Record MotionCor version and detector/movie metadata."
    status: gated
    notes: "Confirm terms before packaging."
  ctffind:
    role: ctf_estimation
    image_family: cryo-core
    install_method: source_or_binary_with_terms_review
    license_class: verify_before_packaging
    license_gate: terms_review
    runpod_fit: strong
    gpu_class: "CPU acceptable; GPU not required"
    smoke_command: "ctffind --help || ctffind4 --help"
    runtime_artifacts: "ctf_summary.tsv, ctf_qc_plots/"
    citation_notes: "Record CTFFIND version and CTF thresholds."
    status: gated
    notes: "Common CTF estimation lane."
  gctf:
    role: ctf_estimation
    image_family: cryo-core
    install_method: binary_with_terms_review
    license_class: verify_before_packaging
    license_gate: terms_review
    runpod_fit: possible
    gpu_class: "RTX 4090/L40S/A100"
    smoke_command: "Gctf --help"
    runtime_artifacts: "gctf_summary.tsv"
    citation_notes: "Record Gctf version and thresholds."
    status: gated
    notes: "Optional CTF comparison lane."
  topaz:
    role: particle_picking_denoising
    image_family: cryo-core
    install_method: pip_or_conda
    license_class: open_source_gplv3
    license_gate: none
    runpod_fit: strong
    gpu_class: "RTX 4090/L40S"
    smoke_command: "topaz --help"
    runtime_artifacts: "topaz_pick_manifest.json, particle_coordinates/"
    citation_notes: "Record model/checkpoint and Topaz version."
    status: planned
    notes: "Particle picking and denoising."
  cryolo:
    role: particle_picking
    image_family: cryo-core
    install_method: conda_or_runtime_env
    license_class: academic_noncommercial
    license_gate: academic_noncommercial_terms
    runpod_fit: possible
    gpu_class: "RTX 4090/L40S"
    smoke_command: "cryolo_predict.py --help"
    runtime_artifacts: "cryolo_pick_manifest.json"
    citation_notes: "Record crYOLO version and model."
    status: gated
    notes: "License-constrained comparison lane."
  cryosieve:
    role: particle_sorting
    image_family: cryo-core
    install_method: source_or_pip_after_license_review
    license_class: verify_repo_license
    license_gate: terms_review
    runpod_fit: possible
    gpu_class: "RTX 4090/L40S"
    smoke_command: "cryosieve --help"
    runtime_artifacts: "particle_sorting_manifest.json"
    citation_notes: "Record exact repo commit and method citation."
    status: planned
    notes: "Optional particle filtering lane."
  cryodrgn:
    role: heterogeneity_analysis
    image_family: cryo-core
    install_method: pip_or_source
    license_class: verify_repo_license
    license_gate: terms_review
    runpod_fit: strong
    gpu_class: "L40S/A100/H100"
    smoke_command: "cryodrgn --help"
    runtime_artifacts: "latent_embeddings/, heterogeneity_report.json"
    citation_notes: "Record cryoDRGN version, model args, and checkpoints."
    status: planned
    notes: "Continuous heterogeneity/model-comparison lane."
  recovar:
    role: heterogeneity_analysis
    image_family: cryo-core
    install_method: source_after_license_review
    license_class: verify_repo_license
    license_gate: terms_review
    runpod_fit: possible
    gpu_class: "L40S/A100/H100"
    smoke_command: "recovar --help"
    runtime_artifacts: "recovar_report.json"
    citation_notes: "Record repo commit and paper citation."
    status: planned
    notes: "Optional heterogeneity comparison lane."
  modelangelo:
    role: atomic_model_building
    image_family: model-build
    install_method: pip_or_source
    license_class: open_source_mit
    license_gate: none
    runpod_fit: strong
    gpu_class: "RTX 4090/L40S/A100"
    smoke_command: "model_angelo --help || model-angelo --help"
    runtime_artifacts: "modelangelo_output/, model_build_manifest.json"
    citation_notes: "Record model weights, version, sequence inputs, and map processing."
    status: planned
    notes: "Automatic cryo-EM model building."
  phenix:
    role: model_refinement_validation
    image_family: model-build
    install_method: runtime_license_install
    license_class: free_nonprofit_academic
    license_gate: required_runtime_access
    runpod_fit: strong_with_license
    gpu_class: "CPU acceptable; GPU optional"
    smoke_command: "phenix.version"
    runtime_artifacts: "phenix_validation.json, real_space_refine_outputs/"
    citation_notes: "Record Phenix version and validation modules."
    status: gated
    notes: "Refinement, map-to-model, validation; do not redistribute installers without checking terms."
  coot:
    role: manual_model_building
    image_family: model-build
    install_method: package_or_source
    license_class: open_source_gpl
    license_gate: none
    runpod_fit: gui_or_vnc
    gpu_class: "CPU acceptable"
    smoke_command: "coot --version"
    runtime_artifacts: "coot_session_notes.md"
    citation_notes: "Record Coot version and manual edits."
    status: planned
    notes: "Manual/interactive model building."
  chimerax:
    role: visualization_figures_model_review
    image_family: model-build
    install_method: runtime_installer_or_local_review
    license_class: no_cost_noncommercial
    license_gate: noncommercial_terms
    runpod_fit: gui_or_scripted
    gpu_class: "GPU helpful for rendering; CPU possible"
    smoke_command: "ChimeraX --version || chimerax --version"
    runtime_artifacts: "chimerax_sessions/, figure_panels/"
    citation_notes: "Record ChimeraX version, commands, contour levels, camera state."
    status: gated
    notes: |
      Use for figures, sessions, model/map inspection. Multi-panel atlas
      render lanes use ChimeraX 1.x noncommercial; operator must confirm
      noncommercial use (or record a commercial license override) per
      docs/tooling-and-licensing.md before render promotion. ChimeraX is
      not redistributed in the public model-build image; runtime install
      is operator-driven.
  pymol:
    role: visualization_figures
    image_family: model-build
    install_method: open_source_build_or_license_specific_installer
    license_class: open_source_or_academic_license_dependent
    license_gate: terms_review
    runpod_fit: scripted
    gpu_class: "CPU acceptable for scripted renders"
    smoke_command: "pymol -cq -d 'quit'"
    runtime_artifacts: "pymol_sessions/, figure_panels/"
    citation_notes: "Record PyMOL build/license channel and render settings."
    status: planned
    notes: "Scripted figure lane."
  isolde:
    role: model_interactive_refinement
    image_family: model-build
    install_method: chimerax_bundle_runtime
    license_class: verify_bundle_terms
    license_gate: chimerax_terms
    runpod_fit: gui_or_vnc
    gpu_class: "GPU helpful"
    smoke_command: "ChimeraX --nogui --cmd 'exit'"
    runtime_artifacts: "isolde_session_notes.md"
    citation_notes: "Record ChimeraX/ISOLDE versions and manual interventions."
    status: gated
    notes: "Interactive refinement lane."
  boltz:
    role: biomolecular_prediction_and_affinity
    image_family: ai-design
    install_method: pip
    pip_package: "boltz[cuda]==2.2.1"
    upstream_repo: "https://github.com/jwohlwend/boltz"
    upstream_release_tag: "v2.2.1"
    upstream_commit_sha: "cb04aeccdd480fd4db707f0bbafde538397fa2ac"
    upstream_release_date: "2025-09-08"
    pypi_wheel_sha256: "b8c62bbdede1922931d9203118f62c858f11aa699bf91fd4c05a5ed6a6d8b4fc"
    pypi_sdist_sha256: "355a033ce2b49543a927470d585136794521d8639b2eeb5a1818d74dc3e513c3"
    license_class: open_source_mit
    license_gate: none
    runpod_fit: strong
    gpu_class: "L40S/A100/H100"
    smoke_command: "boltz --help"
    runtime_artifacts: "boltz_predictions/, boltz_manifest.json"
    citation_notes: "Record model version, input FASTA/MSA/ligands, and confidence outputs."
    weights_cache_default: "~/.boltz"
    weights_cache_env_var: "BOLTZ_CACHE"
    weights_cache_cli_flag: "--cache"
    weights_auto_download: true
    weights_source: "auto-downloaded by `boltz predict` on first run; no manual HF pull needed"
    status: pinned
    notes: |
      Model-comparison and design support lane. Pinned to v2.2.1 (released
      2025-09-08, MIT, model: Boltz-2). The `boltz` PyPI package installs
      both Boltz-1 and Boltz-2; default model is Boltz-2.

      Weights are auto-downloaded by `boltz predict` on first invocation to
      whichever directory the `--cache` flag (or BOLTZ_CACHE env var) points
      at. A provider entrypoint may pass a dedicated runtime cache such as
      `/workspace/structure-factory/weights/boltz` via `--boltz-weights-dir`.
      A persistent runtime cache is optional; auto-download works without it
      but adds cold-pull time to the first pod.

      Provider bootstraps should pip-install this version when the CLI is
      absent. Override the version via env var
      STRUCTURE_FACTORY_BOLTZ_VERSION.
  esmfold2:
    role: biomolecular_complex_structure_prediction_and_sequence_design
    image_family: ai-design
    install_method: pinned_source_or_biohub_api
    pip_package: "esm @ git+https://github.com/Biohub/esm.git@f652b471d29da828b31e9b7a9cf7d0a7803240f5"
    upstream_repo: "https://github.com/Biohub/esm"
    upstream_commit_sha: "f652b471d29da828b31e9b7a9cf7d0a7803240f5"
    upstream_model_repo: "https://huggingface.co/biohub/ESMFold2"
    upstream_model_sha_observed_2026_05_28: "e1e189d0f5fb70c2693da2332eca4443c0ccccd6"
    upstream_fast_model_repo: "https://huggingface.co/biohub/ESMFold2-Fast"
    upstream_fast_model_sha_observed_2026_05_28: "0438ea0d932a314950665e0b4d0af4322ae88250"
    upstream_transformers_model_repo: "https://huggingface.co/biohub/ESMFold2-hf"
    upstream_transformers_model_sha_observed_2026_08_28: "bce015efb23b5dc604842d0ab5c2bbb02c7bd3ee"
    upstream_transformers_docs: "https://huggingface.co/docs/transformers/main/model_doc/esmfold2"
    upstream_esmc_model_repo: "https://huggingface.co/biohub/ESMC-6B"
    upstream_esmc_model_sha_observed_2026_05_28: "89c554c46a44d825fbfbe3ce2a6bdc539770bdaa"
    biohub_model_ids: "esmfold2-2026-05, esmfold2-fast-2026-05"
    primary_source_checked: "2026-08-28; Biohub/esm LICENSE.md and THIRD_PARTY_NOTICE.md at the pinned source revision, Biohub acceptable-use policy, pinned Hugging Face model cards, and the official Transformers ESMFold2 main documentation."
    license_class: mit_with_third_party_notices_reviewed
    license_gate: none
    route_terms: "biohub_api=biohub_api_terms_and_aup"
    runpod_fit: strong_after_provider_smoke_and_fast_canary
    gpu_class: "L40S/A100/H100 for first canary; A10-class generic cloud VM may fit small fast-model runs after Torch/CUDA proof"
    smoke_command: "bsf-esmfold2-predict readiness --variant full"
    runtime_artifacts: "predictions.jsonl, predictions/*/structure.cif, predictions/*/confidence.json.gz, predictions/*/confidence-summary.json"
    citation_notes: "Record Biohub ESM source commit, Hugging Face model revisions, API/local route, inputs, confidence outputs, and Biohub ESM citation."
    weights_cache_default: "HF_HOME"
    weights_cache_env_var: "HF_HOME"
    weights_source: "Hugging Face biohub/ESMFold2 and biohub/ESMFold2-Fast through Biohub esm; biohub/ESMFold2-hf through Transformers main; or Biohub API with secure runtime API key."
    status: planned
    notes: |
      Biohub ESMFold2 folds biomolecular inputs and can optimize sequence logits
      through a differentiable structure objective. Record prediction and
      sequence-design runs as separate operations with separate adapters. The
      bundled prediction wrapper is ready, but the optional package, cached
      checkpoints, CCD file, and CUDA device remain runtime readiness checks.
      The official biohub/ESMFold2-hf checkpoint is an alternative full-model
      route through Transformers main. It is not wired to the bundled wrapper;
      supply a validated adapter when selecting that route.
      The pinned local-weight route has no repository-imposed license gate. The
      Biohub API route requires the API terms, acceptable-use policy, budget,
      and data handling review that apply to that service. ESMFold2 outputs do
      not confirm binding, function, therapeutic value, or safety.
  esmfold2-fast:
    role: biomolecular_complex_structure_prediction_and_sequence_design_variant
    image_family: ai-design
    install_method: hosted_api_or_pinned_huggingface_snapshot
    upstream_repo: "https://github.com/Biohub/esm"
    upstream_model_repo: "https://huggingface.co/biohub/ESMFold2-Fast"
    upstream_model_sha_observed_2026_05_28: "0438ea0d932a314950665e0b4d0af4322ae88250"
    primary_source_checked: "2026-08-28; Biohub ESM source license and third-party notice, Biohub acceptable-use policy, and the pinned ESMFold2-Fast model card."
    license_class: mit_with_third_party_notices_reviewed
    license_gate: none
    route_terms: "biohub_api=biohub_api_terms_and_aup"
    runpod_fit: strong_after_provider_canary
    gpu_class: "RTX 4090/L40S for a first canary; measure larger inputs before scaling"
    smoke_command: "bsf-esmfold2-predict readiness --variant fast"
    runtime_artifacts: "predictions.jsonl, predictions/*/structure.cif, predictions/*/confidence.json.gz, predictions/*/confidence-summary.json"
    citation_notes: "Record the source commit, ESMFold2-Fast model revision, API or local route, inputs, and confidence outputs."
    status: planned
    notes: "Selectable ESMFold2 family variant for lower-cost fold or gradient-inversion design canaries. The bundled prediction wrapper uses cached local snapshots; package, checkpoint, CCD, and CUDA readiness remain runtime checks. Treat Fast as a variant, not an independent predictor, when comparing predictor agreement."
  simplefold:
    role: single_protein_structure_and_conformational_ensemble_prediction
    image_family: runtime_only
    install_method: pinned_source_with_runtime_model_acquisition
    pip_package: "simplefold @ git+https://github.com/apple/ml-simplefold.git@c7a5570a6be9f5c695126e27c804e77567209934"
    upstream_repo: "https://github.com/apple/ml-simplefold"
    upstream_commit_sha: "c7a5570a6be9f5c695126e27c804e77567209934"
    upstream_model_source: "https://ml-site.cdn-apple.com/models/simplefold/"
    released_models: "simplefold_100M, simplefold_360M, simplefold_700M, simplefold_1.1B, simplefold_1.6B, simplefold_3B"
    inference_backends: "PyTorch; MLX on Apple silicon"
    primary_source_checked: "2026-08-30; Apple repository README, CLI and FASTA parser at c7a5570, MIT LICENSE, Apple Machine Learning Research Model License, and arXiv:2509.18480."
    license_class: mit_code_apple_research_only_model_assets
    license_gate: noncommercial_scientific_research_model_terms
    runpod_fit: possible_after_runtime_adapter_and_asset_review
    gpu_class: "Select against model size and backend; measure memory and runtime with a public canary before a batch."
    smoke_command: "adapter_required"
    runtime_artifacts: "sampled_structures/, sample_manifest.json, versions.json, asset_manifest.json, validation_notes.md"
    citation_notes: "Record the Apple source commit, selected model and checkpoint hash, backend, ESM2 and CCD asset revisions, input sequence hash, steps, tau, sample count, seed, output format, pLDDT setting, and SimpleFold paper."
    weights_cache_default: ".runtime/tools/simplefold/assets"
    weights_source: "Apple-hosted SimpleFold checkpoints plus upstream ESM2 and CCD assets. Acquire them only after the model-license gate and record their source revisions and hashes."
    status: planned
    notes: |
      SimpleFold performs stochastic single-protein structure generation from
      FASTA input and can emit multiple conformers in PDB or mmCIF format. The
      upstream CLI exposes model size, sampling steps, tau, sample count,
      optional pLDDT, output format, backend, and seed.

      Use SimpleFold to compare monomer foldability or conformational spread.
      It does not replace a target-binder cofold predictor or an interface
      scorer. The current public registry supplies an external-adapter contract
      rather than an installed command. A user-selected adapter may wrap a
      local, cloud, scheduler, container, or platform-skill execution route.

      Keep model assets and generated structures outside public git. The source
      code uses MIT terms, but Apple's released model assets permit only the
      research purposes defined in LICENSE_MODEL. Record that use context
      before downloading or running the released models.
  chai:
    role: biomolecular_prediction
    image_family: ai-design
    install_method: source_after_license_review
    license_class: apache_2_reported_by_repo
    license_gate: verify_current_terms
    runpod_fit: strong
    gpu_class: "L40S/A100/H100"
    smoke_command: "python -c 'import chai_lab'"
    runtime_artifacts: "chai_predictions/, chai_manifest.json"
    citation_notes: "Record repo commit, model weights, and inputs."
    status: planned
    notes: "Verify current repo/license before packaging."
  opendde:
    role: biomolecular_complex_prediction
    image_family: ai-design
    install_method: source_or_public_docker
    upstream_repo: "https://github.com/aurekaresearch/OpenDDE"
    upstream_commit_sha_observed_2026_07_05: "a72e9f655231660f8af0072dbdb8b2a54f3fbd3c"
    docker_image: "aurekaresearch/opendde:v1"
    docker_tag_digest_observed_2026_07_05: "sha256:a9404f76df1cd965a80447ee30c9c440af48b199581d9bd44ee157c18109a9d6"
    upstream_model_repo: "https://huggingface.co/aurekaresearch/OpenDDE"
    upstream_model_repo_commit_observed_2026_07_05: "eddd563ce96571f784012edd8f045181c8f8627d"
    released_checkpoints: "opendde.pt, opendde_abag.pt"
    checkpoint_sizes_observed_2026_07_05: "opendde.pt ~2.5GB; opendde_abag.pt ~2.5GB"
    common_runtime_size_observed_2026_07_05: "~0.65GB before search databases"
    license_class: open_source_apache_2_reported_by_repo
    license_gate: verify_current_terms_and_weight_posture
    runpod_fit: strong_after_no_search_canary
    gpu_class: "RTX 4090/L40S for canaries; 4x GPU for Fold-CP distributed route"
    smoke_command: "opendde doctor && opendde --help"
    runtime_artifacts: "opendde_predictions/, opendde_manifest.json, summary_confidence.json, full_data.json when --need_atom_confidence true"
    citation_notes: "Record repo commit, Docker digest or source install route, Hugging Face model commit, checkpoint hashes, input JSON, MSA/template posture, and confidence sidecars."
    weights_cache_default: "$OPENDDE_ROOT_DIR/checkpoint"
    weights_cache_env_var: "OPENDDE_ROOT_DIR"
    weights_source: "Hugging Face aurekaresearch/OpenDDE; opendde.pt default, opendde_abag.pt selected with --load_checkpoint_path."
    status: planned
    notes: |
      AlphaFold-3-style all-atom prediction/cofold lane for proteins, DNA,
      RNA, ligands, ions, explicit covalent bonds, and antibody-antigen
      canaries. Use as an orthogonal validator next to Boltz, Chai-1,
      AF2-Multimer, and ESMFold2, not as a generator.

      Start with a no-search public protein canary:
      --use_msa false --use_template false --use_rna_msa false. Promote to
      MSA/template/RNA-MSA only after database, HMMER/Kalign, and public/private
      sequence posture are declared. Do not send private sequences to the public
      ColabFold-compatible MMseqs2 service.

      The reviewed source path loads PyTorch and pickle-based runtime artifacts,
      including the model checkpoint and RDKit CCD cache. Execution-ready
      provider packets must pin URL, remote ETag/Xet hash where available, local
      SHA-256, and byte size before loading. For ipSAE-style rescoring, run with
      --need_atom_confidence true and preserve the full_data JSON; summary-only
      output is scalar confidence, not a complete interface sidecar bundle.
  alphafold3:
    role: biomolecular_prediction
    image_family: ai-design
    install_method: manual_terms_and_weights
    license_class: noncommercial_restricted_weights
    license_gate: required_runtime_access
    runpod_fit: strong_with_manual_terms
    gpu_class: "A100/H100 preferred"
    smoke_command: "python run_alphafold.py --help"
    runtime_artifacts: "alphafold3_predictions/, af3_manifest.json"
    citation_notes: "Record exact terms, model params access, database versions, and input JSON."
    status: gated
    notes: "Do not assume weights are available; keep terms explicit."
  alphafold2_multimer_v3:
